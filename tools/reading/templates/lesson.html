<main id="main-content" class="lesson-layout main-shell">
  <details class="toc-panel" open>
    <summary>本页目录</summary>
    <nav aria-label="本页目录">
      $toc_html
    </nav>
  </details>
  <article class="lesson-article">
    <header class="lesson-header">
      <a class="back-link" href="$home_href">← 全部课程</a>
      <a class="share-download" download href="$share_href">下载独立分享版</a>
      <p class="eyebrow">$lesson_number</p>
      <h1>$title</h1>
    </header>
    <div class="article-content">
      $article_html
    </div>
    <nav class="lesson-pager" aria-label="课程导航">
      $pager_html
    </nav>
  </article>
</main>
